plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.kotlin.compose)
  alias(libs.plugins.kotlin.serialization)
  alias(libs.plugins.ksp)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { localProperties.load(it) }
}
def huggingFaceToken = localProperties.getProperty('huggingFaceToken', '')

android {
  namespace 'com.campusmind.app'
  compileSdk 36

  defaultConfig {
    applicationId 'com.campusmind.app'
    minSdk 31
    targetSdk 36
    versionCode 1
    versionName '0.1.0'
    resValue 'string', 'hugging_face_token', huggingFaceToken
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      // Signed with the auto-managed debug key so the distributable APK installs without a custom keystore.
      signingConfig signingConfigs.debug
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // Ship a single arm64 APK (covers virtually all modern phones) to stay under GitHub's file size limit.
      ndk {
        abiFilters 'arm64-v8a'
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  kotlinOptions {
    jvmTarget = '11'
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  implementation libs.androidx.core.ktx
  implementation libs.androidx.lifecycle.runtime.ktx
  implementation libs.androidx.lifecycle.viewmodel.compose
  implementation libs.androidx.activity.compose
  implementation platform(libs.androidx.compose.bom)
  implementation libs.androidx.ui
  implementation libs.androidx.ui.graphics
  implementation libs.androidx.material.icons.extended
  implementation libs.androidx.ui.tooling.preview
  implementation libs.androidx.material3
  implementation libs.androidx.navigation.compose
  implementation libs.kotlinx.serialization.json
  implementation libs.androidx.room.runtime
  implementation libs.androidx.room.ktx
  implementation libs.androidx.work.runtime
  implementation libs.androidx.datastore
  implementation libs.litertlm
  implementation libs.mlkit.text.recognition

  ksp libs.androidx.room.compiler

  debugImplementation libs.androidx.ui.tooling
}
