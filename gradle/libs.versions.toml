navigation = "2.8.9"
serializationJson = "1.7.3"
room = "2.7.0"
ksp = "2.2.0-2.0.2"
work = "2.10.0"
datastore = "1.1.7"
litertlm = "0.11.0"
mlkitText = "16.0.1"
junit = "4.13.2"
